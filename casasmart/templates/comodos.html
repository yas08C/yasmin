{% extends "base.html" %}
{% block conteudo %}
<h2>Cômodos</h2>

<form method="post" action="/comodos/novo">
    <input type="text" name="nome" placeholder="Nome do novo cômodo" required>
    <button type="submit">Adicionar</button>
</form>

<table>
    <tr><th>ID</th><th>Nome</th><th>Ações</th></tr>
    {% for c in comodos %}
    <tr>
        <td>{{ c.id }}</td>
        <td>
            <form method="post" action="/comodos/{{ c.id }}/renomear" class="inline">
                <input type="text" name="nome" value="{{ c.nome }}" required>
                <button type="submit">Salvar nome</button>
            </form>
        </td>
        <td>
            <form method="post" action="/comodos/{{ c.id }}/apagar" class="inline">
                <button type="submit" class="perigo">Apagar</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
